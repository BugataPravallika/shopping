services:
  - type: web
    name: proshop-v2
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
